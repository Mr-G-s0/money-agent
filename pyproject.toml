[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "money-agent"
version = "0.3.0"
description = "A safety-first, simulated autonomous business agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai-agents>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "mypy>=1.11,<2", "pyright>=1.1,<2"]

[project.scripts]
money-agent = "money_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/money_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
